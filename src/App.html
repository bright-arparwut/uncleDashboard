<script>
  const APP_URL = document.body.dataset.appUrl;
  const STEPS = [
    'kc', 'stepPlan', 'stepPublish', 'stepTor', 'stepMedianPrice', 'stepPurchaseReport', 'stepBidOpen',
    'stepApprovalRequest', 'stepApproved', 'stepDisburse', 'stepCommit', 'deliveryDeadline', 'stepLedger',
  ];
  const CLASSIFICATION = ['unit', 'project', 'type', 'plan', 'station', 'group', 'method', 'authority'];
  const LIST_COLUMNS = ['code', 'name', 'budget', 'step', 'station'];
  const LIST_HEADERS = { step: 'ขั้นตอน' }; // not a sheet column: the Stuck chain position
  const STATUS_COLORS = 8;
  // Light to dark along the process, so the Stage order reads at a glance.
  // Light to dark blue while in progress, green once done.
  const STAGE_COLORS = ['#a9c4eb', '#6f9fdd', '#3f7fcf', '#1f5fbf', '#123a75', '#2e7d32'];
  // What an item is waiting on in each Stage (see Stage in CONTEXT.md).
  const STAGE_NAMES = {
    kc: 'อยู่ระหว่างจัดทำ คฉ.',
    stepPlan: 'คฉ. อนุมัติ/จัดทำแผนจัดหา',
    stepApproved: 'อนุมัติแผนจัดหา/ดำเนินกรรมวิธี',
    stepCommit: 'อนุมัติซื้อ/รอผูกพัน',
    stepLedger: 'ผูกพันแล้ว/รอส่งของ',
    done: 'ขึ้นบัญชีคุม',
  };
  // Fixed step names: the sheet's header over these columns can be a merged group title or blank.
  const STAGE_COLUMN_NAMES = { kc: 'คฉ.', stepPlan: 'แผนจัดหา', stepApproved: 'อนุมัติ ซื้อ/จ้าง', stepCommit: 'ผูกพัน', stepLedger: 'ขึ้นบัญชีคุม' };
  const SLICE_LABEL_MIN = 4; // percent; smaller slices are too thin to hold a number
  const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

  const app = document.getElementById('app');
  const yearSelect = document.getElementById('year');
  const emptyFilters = () => ({ year: '', q: '', unit: '', project: '', type: '', group: '', status: '', stage: '' });
  let state = { list: null, filters: emptyFilters() };

  // ---- helpers ----

  function call(fn, ...args) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
  }

  function esc(value) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(value ?? '').replace(/[&<>"']/g, c => map[c]);
  }

  const isBlank = v => v === null || v === undefined || v === '';
  const isDate = v => typeof v === 'string' && ISO_DATE.test(v);
  const thaiDate = iso => new Date(iso + 'T00:00:00')
    .toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  const show = v => isBlank(v) ? '—' : esc(isDate(v) ? thaiDate(v) : v);

  function toNumber(v) {
    if (typeof v === 'number') return v;
    const n = parseFloat(String(v ?? '').replace(/,/g, ''));
    return isNaN(n) ? null : n;
  }

  function money(v) {
    const n = toNumber(v);
    return n === null ? show(v) : n.toLocaleString('th-TH', { maximumFractionDigits: 2 });
  }

  const millions = n => (n / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' ลบ.';

  // Colour by hashing the status text, so a status keeps its colour on every page.
  function statusBadge(status) {
    if (isBlank(status)) return '';
    const hash = [...String(status)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 0);
    return `<span class="badge s${hash % STATUS_COLORS}">${esc(status)}</span>`;
  }

  const overdueBadge = item => item.isOverdue ? ' <span class="badge danger">เกินกำหนด</span>' : '';
  const stepName = (key, labels) => STAGE_COLUMN_NAMES[key] ?? labels[key];
  // Where an item is on the คฉ.→อนุมัติ ซื้อ/จ้าง chain watched for Stuck, and for how long.
  function waitingText(item, labels) {
    if (item.waitingFor) return `${stepName(item.waitingFor, labels)} · ทำมาแล้ว ${item.waitingDays} วัน`;
    return isDate(item.stepApproved) ? `${stepName('stepApproved', labels)}แล้ว` : stepName('kc', labels);
  }
  const stepBadge = (item, labels) =>
    `<span class="badge ${item.isStuck ? 'warn' : 'waiting'}">${esc(waitingText(item, labels))}</span>`;
  const stuckBadge = (item, labels) => item.isStuck ? ' ' + stepBadge(item, labels) : '';

  function distinct(items, key) {
    const values = items.map(i => i[key]).filter(v => !isBlank(v)).map(String);
    return [...new Set(values)].sort((a, b) => a.localeCompare(b, 'th'));
  }

  function setView(html) {
    app.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function fail(err) {
    setView(`<div class="card error">
      <p>โหลดข้อมูลไม่สำเร็จ</p>
      <p class="muted">${esc((err && err.message) || err)}</p>
      <p class="muted">หากไม่มีสิทธิ์ ให้ขอสิทธิ์ดูชีตจากผู้ดูแล</p>
    </div>`);
  }

  // ---- routing (list: no params, detail: ?item=<Item Code>) ----

  // Bumped on every navigation, so a slow response for a page the user already left is dropped.
  let navigation = 0;

  function route(params) {
    const ticket = ++navigation;
    const isCurrent = () => ticket === navigation;
    const view = params.item ? showDetail(params.item, isCurrent) : showList(isCurrent);
    return view.catch(err => { if (isCurrent()) fail(err); });
  }

  function go(params) {
    google.script.history.push(null, params);
    route(params);
  }

  // ---- list page ----

  // The whole tab is loaded once; Fiscal Year is then just a filter, defaulting to the current one.
  function setList(list) {
    const items = [...list.items].sort((a, b) => a.code.localeCompare(b.code, 'th', { numeric: true }));
    const years = [...new Set(items.map(i => i.fiscalYear).filter(Boolean))].sort((a, b) => b - a);
    const year = years.includes(list.currentFiscalYear) ? list.currentFiscalYear : years[0];
    state = { ...state, list: { ...list, items }, filters: { ...state.filters, year: year ? String(year) : '' } };
    yearSelect.innerHTML = years.map(y => `<option value="${y}">ปีงบ ${y}</option>`).join('')
      + '<option value="">ทุกปี</option>';
    yearSelect.value = state.filters.year;
  }

  async function showList(isCurrent) {
    if (!state.list) {
      setView('<p class="muted">กำลังโหลด…</p>');
      const list = await call('getList');
      if (!isCurrent()) return;
      setList(list);
    }
    renderListShell();
    renderListBody();
  }

  function filterSelect(key, label, options, selected) {
    const opts = options.map(o => `<option value="${esc(o)}"${o === selected ? ' selected' : ''}>${esc(o)}</option>`);
    return `<select data-filter="${key}" aria-label="${esc(label)}"><option value="">${esc(label)}: ทั้งหมด</option>${opts.join('')}</select>`;
  }

  function renderListShell() {
    const { items, labels } = state.list;
    const f = state.filters;
    setView(`
      <div id="summary" class="cards"></div>
      <section id="stages" class="card stages" aria-label="ขั้นตอนปัจจุบัน"></section>
      <div class="filters">
        <input type="search" data-filter="q" placeholder="ค้นหารหัสหรือชื่อรายการ" value="${esc(f.q)}" aria-label="ค้นหา">
        ${filterSelect('unit', labels.unit, distinct(items, 'unit'), f.unit)}
        ${filterSelect('project', labels.project, distinct(items, 'project'), f.project)}
        ${filterSelect('type', labels.type, distinct(items, 'type'), f.type)}
        ${filterSelect('group', labels.group, distinct(items, 'group'), f.group)}
        ${filterSelect('status', labels.status, distinct(items, 'status'), f.status)}
      </div>
      <p id="count" class="count muted"></p>
      <div id="items" class="list"></div>
      <h2 id="stuck-title" class="section-title"></h2>
      <div id="stuck" class="list"></div>
      <h2 id="overdue-title" class="section-title"></h2>
      <div id="overdue" class="list"></div>`);

    app.querySelectorAll('[data-filter]').forEach(input => {
      input.addEventListener('input', () => setFilter(input.dataset.filter, input.value));
    });
    app.querySelector('#summary').addEventListener('click', e => {
      const card = e.target.closest('[data-jump]');
      if (card) app.querySelector(`#${card.dataset.jump}-title`).scrollIntoView({ behavior: 'smooth' });
    });
    app.querySelector('#stages').addEventListener('click', e => {
      const slice = e.target.closest('[data-stage]');
      if (slice) setFilter('stage', state.filters.stage === slice.dataset.stage ? '' : slice.dataset.stage);
    });
    app.querySelectorAll('.list').forEach(list => list.addEventListener('click', e => {
      const row = e.target.closest('[data-code]');
      if (row) go({ item: row.dataset.code });
    }));
  }

  function setFilter(key, value) {
    state = { ...state, filters: { ...state.filters, [key]: value } };
    renderListBody();
  }

  function matches(item, f) {
    const q = f.q.trim().toLowerCase();
    const same = key => !f[key] || String(item[key] ?? '') === f[key];
    return (!q || (item.code + ' ' + (item.name ?? '')).toLowerCase().includes(q))
      && (!f.year || String(item.fiscalYear) === f.year)
      && same('unit') && same('project') && same('type') && same('group') && same('status') && same('stage');
  }

  // A KPI card that scrolls to its section below the list; the count takes the tone colour when non-zero.
  function jumpCard(section, label, count, tone) {
    return `<button type="button" data-jump="${section}" class="kpi ${tone}${count ? ' has' : ''}">
      <span>${label}</span><strong>${count.toLocaleString('th-TH')}</strong>
    </button>`;
  }

  function itemList(items, empty) {
    const { labels, duplicateCodes } = state.list;
    if (!items.length) return `<p class="muted">${empty}</p>`;
    const head = `<div class="row head">${LIST_COLUMNS.map(k => `<span>${esc(LIST_HEADERS[k] ?? labels[k])}</span>`).join('')}</div>`;
    return head + items.map(item => `
      <button type="button" class="row" data-code="${esc(item.code)}">
        <span class="code">${esc(item.code)}${duplicateCodes.includes(item.code) ? ' <span class="badge warn">รหัสซ้ำ</span>' : ''}</span>
        <span class="name">${show(item.name)}</span>
        <span class="budget">${money(item.budget)}</span>
        <span>${stepBadge(item, labels)}${overdueBadge(item)}</span>
        <span class="station">${show(item.station)}</span>
      </button>`).join('');
  }

  function renderListBody() {
    const { items } = state.list;
    const f = state.filters;
    const inYear = items.filter(item => !f.year || String(item.fiscalYear) === f.year);
    const shown = items.filter(item => matches(item, f));
    const budget = shown.reduce((sum, item) => sum + (toNumber(item.budget) || 0), 0);
    const stuck = shown.filter(i => i.isStuck).sort((a, b) => b.waitingDays - a.waitingDays);
    const overdue = shown.filter(i => i.isOverdue).sort((a, b) => a.deliveryDeadline.localeCompare(b.deliveryDeadline));

    app.querySelector('#summary').innerHTML = `
      <div class="kpi"><span>จำนวนรายการ</span><strong>${shown.length.toLocaleString('th-TH')}</strong></div>
      <div class="kpi"><span>วงเงินรวม</span><strong>${millions(budget)}</strong></div>
      <div class="kpi"><span>อนุมัติแล้ว</span><strong>${shown.filter(i => i.isApproved).length.toLocaleString('th-TH')}</strong></div>
      ${jumpCard('overdue', 'เกินกำหนด', overdue.length, 'danger')}
      ${jumpCard('stuck', 'ค้างเกิน 10 วัน', stuck.length, 'warn')}`;

    // The chart ignores its own Stage filter, so the other slices stay visible around the selected one.
    app.querySelector('#stages').innerHTML = stageChart(items.filter(item => matches(item, { ...f, stage: '' })));

    app.querySelector('#count').textContent = `แสดง ${shown.length} จาก ${inYear.length} รายการ`;

    app.querySelector('#items').innerHTML = itemList(shown, 'ไม่พบรายการ');

    // Always shown below the list, longest-waiting first, so nobody has to go looking for them.
    app.querySelector('#stuck-title').textContent = `ค้างเกิน 10 วัน (${stuck.length})`;
    app.querySelector('#stuck').innerHTML = itemList(stuck, 'ไม่มีรายการค้าง');
    app.querySelector('#overdue-title').textContent = `เกินกำหนดส่งมอบ (${overdue.length})`;
    app.querySelector('#overdue').innerHTML = itemList(overdue, 'ไม่มีรายการเกินกำหนด');
  }

  // Donut of stroked circles: circumference 100, so each dash length is the slice's percent.
  function stageChart(items) {
    const { stages } = state.list;
    const selected = state.filters.stage;
    const total = items.length;
    const counts = stages.map(key => items.filter(item => item.stage === key).length);
    const percent = n => total ? n / total * 100 : 0;
    const dim = key => selected && selected !== key ? ' dim' : '';
    let start = 0;
    const slices = stages.map((key, i) => {
      const size = percent(counts[i]);
      const offset = 25 - start; // start at 12 o'clock
      const angle = (start + size / 2) / 100 * 2 * Math.PI - Math.PI / 2;
      start += size;
      if (!size) return '';
      const label = size >= SLICE_LABEL_MIN
        ? `<text class="slice-label${i < 2 ? ' on-light' : ''}${dim(key)}" x="${21 + 15.915 * Math.cos(angle)}" y="${21 + 15.915 * Math.sin(angle)}">${counts[i]}</text>` : '';
      return `<circle class="slice${dim(key)}" data-stage="${key}" r="15.915" cx="21" cy="21" stroke="${STAGE_COLORS[i]}"
        stroke-dasharray="${size} ${100 - size}" stroke-dashoffset="${offset}"><title>${STAGE_NAMES[key]}: ${counts[i]}</title></circle>${label}`;
    });
    const legend = stages.map((key, i) => `
      <button type="button" class="legend${dim(key)}" data-stage="${key}" aria-pressed="${selected === key}">
        <i style="background:${STAGE_COLORS[i]}"></i><span>${STAGE_NAMES[key]}</span>
        <strong>${counts[i].toLocaleString('th-TH')}</strong>
        <small class="muted">${Math.round(percent(counts[i]))}%</small>
      </button>`);
    return `<h2>ขั้นตอนปัจจุบัน</h2>
      <div class="stage-body">
        <svg viewBox="0 0 42 42" class="donut" role="img" aria-label="จำนวนรายการตามขั้นตอนปัจจุบัน">
          <circle r="15.915" cx="21" cy="21" class="ring"></circle>${slices.join('')}
          <text x="21" y="21" class="total">${total.toLocaleString('th-TH')}</text>
          <text x="21" y="26.5" class="total-label">รายการ</text>
        </svg>
        <div class="legends">${legend.join('')}</div>
      </div>`;
  }

  // ---- detail page ----

  // Shows the row already loaded with the list at once, then re-renders only if the fresh row differs.
  async function showDetail(code, isCurrent) {
    const list = state.list;
    const cached = list && list.items.find(item => item.code === code);
    if (cached) renderDetail({ labels: list.labels, item: cached, sheetUrl: list.sheetUrl });
    else setView('<p class="muted">กำลังโหลด…</p>');

    const result = await call('getItem', code);
    if (!isCurrent()) return;
    if (!result) {
      setView(`<button type="button" class="link back" data-back>← กลับ</button>
        <p class="card error">ไม่พบรายการรหัส ${esc(code)}</p>`);
      bindBack();
    } else if (!cached || JSON.stringify(result.item) !== JSON.stringify(cached)) {
      renderDetail(result);
    }
  }

  function bindBack() {
    app.querySelector('[data-back]').addEventListener('click', () => go({}));
  }

  function moneyCard(labels, item) {
    const budget = toNumber(item.budget);
    const approved = toNumber(item.approvedAmount);
    const savings = budget !== null && approved !== null ? budget - approved : null;
    const percent = savings !== null && budget
      ? ` (${(savings / budget * 100).toLocaleString('th-TH', { maximumFractionDigits: 1 })}%)` : '';
    return `<section class="card money">
      <div><span class="muted">${esc(labels.budget)}</span><strong>${money(item.budget)}</strong></div>
      <div><span class="muted">${esc(labels.approvedAmount)}</span><strong>${money(item.approvedAmount)}</strong></div>
      ${savings === null ? '' : `<div class="saving"><span class="muted">ประหยัด</span><strong>${money(savings)}${percent}</strong></div>`}
    </section>`;
  }

  function stepItem(key, labels, item) {
    const value = item[key];
    if (key === 'deliveryDeadline') {
      return `<li class="step deadline${item.isOverdue ? ' overdue' : ''}">
        <span class="label">กำหนดส่งมอบ <small class="muted">(${esc(labels[key])})</small></span>
        <span class="value">${show(value)}${item.isOverdue ? ' · เกินกำหนด' : ''}</span>
      </li>`;
    }
    const kind = isDate(value) ? 'done' : isBlank(value) ? 'pending' : 'info';
    return `<li class="step ${kind}">
      <span class="label">${esc(stepName(key, labels))}</span>
      <span class="value">${isBlank(value) ? 'ยังไม่ดำเนินการ' : show(value)}</span>
    </li>`;
  }

  function renderDetail({ labels, item, sheetUrl }) {
    // openExternalBrowser=1 makes LINE open the link in Chrome/Safari, where Google sign-in works.
    const link = `${APP_URL}?item=${encodeURIComponent(item.code)}&openExternalBrowser=1`;
    const year = item.fiscalYear ? ` · ปีงบ ${item.fiscalYear}` : '';
    setView(`
      <button type="button" class="link back" data-back>← กลับ</button>
      <section class="card">
        <p class="muted">${esc(labels.code)} ${esc(item.code)}${year}</p>
        <h1>${show(item.name)}</h1>
        <p>${statusBadge(item.status)}${overdueBadge(item)}${stuckBadge(item, labels)}</p>
      </section>
      ${moneyCard(labels, item)}
      <section class="card">
        <dl class="fields">${CLASSIFICATION.map(k => `<dt>${esc(labels[k])}</dt><dd>${show(item[k])}</dd>`).join('')}</dl>
      </section>
      <section class="card"><h2>${esc(labels.detail)}</h2><p class="prose">${show(item.detail)}</p></section>
      <section class="card"><h2>ขั้นตอนการจัดหา</h2><ol class="steps">${STEPS.map(k => stepItem(k, labels, item)).join('')}</ol></section>
      <section class="card"><h2>${esc(labels.note)}</h2><p class="prose">${show(item.note)}</p></section>
      <section class="card actions">
        <a class="btn" href="${esc(`${sheetUrl}&range=A${item.row}:AB${item.row}`)}" target="_blank" rel="noopener">เปิดใน Sheet</a>
        <input id="share" readonly value="${esc(link)}" aria-label="ลิงก์ของรายการนี้">
        <button type="button" class="btn" data-copy>คัดลอกลิงก์</button>
      </section>`);

    bindBack();
    const copyButton = app.querySelector('[data-copy]');
    copyButton.addEventListener('click', () => {
      const share = app.querySelector('#share');
      // Clipboard can be blocked inside the Apps Script iframe; fall back to selecting the text.
      const copied = navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject();
      copied
        .then(() => { copyButton.textContent = 'คัดลอกแล้ว'; })
        .catch(() => { share.select(); copyButton.textContent = 'กดค้างที่ลิงก์เพื่อคัดลอก'; });
    });
  }

  // ---- start ----

  yearSelect.addEventListener('change', () => {
    state = { ...state, filters: { ...state.filters, year: yearSelect.value } };
    go({});
  });
  document.getElementById('home').addEventListener('click', () => go({}));
  google.script.history.setChangeHandler(e => route(e.location.parameter));
  google.script.url.getLocation(location => route(location.parameter));
</script>
